name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stockflow_ci
          POSTGRES_PASSWORD: stockflow_ci_only
          POSTGRES_DB: stockflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockflow_ci -d stockflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://stockflow_ci:stockflow_ci_only@localhost:5432/stockflow_test
      ALLOW_DESTRUCTIVE_POSTGRES_TESTS: "true"
      APP_ENV: test
      DATABASE_URL: sqlite:///./stockflow-ci.db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build
